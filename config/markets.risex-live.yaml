    exchange: risex
    exchangeSymbol: BTC/USDC
    enabled: true
    leverage: 25
    orderSize: { min: 0.00032, max: 0.00050 }
    spreadBps: { normal: 5, min: 4, max: 7.5 }
    exitSpreadBps: 2.5
    quoteLevels: 5
    levelSpacingBps: [2, 3, 4, 7, 10]
